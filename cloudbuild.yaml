steps:
# Build
- name: 'gcr.io/cloud-builders/docker'
  args:
    - build
    - -t
    - us-central1-docker.pkg.dev/$PROJECT_ID/myrepo/gcs-bigquery-loader:latest
    - .

# Push
- name: 'gcr.io/cloud-builders/docker'
  args:
    - push
    - us-central1-docker.pkg.dev/$PROJECT_ID/myrepo/gcs-bigquery-loader:latest

# Deploy
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    - run
    - deploy
    - gcs-bigquery-loader
    - --image=us-central1-docker.pkg.dev/$PROJECT_ID/myrepo/gcs-bigquery-loader:latest
    - --region=us-central1
    - --platform=managed
    - --allow-unauthenticated

options:
  logging: CLOUD_LOGGING_ONLY