steps:
# Build Docker Image
- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'build'
    - '-t'
    - 'us-central1-docker.pkg.dev/project-77158318-bf9d-4d5d-bcc/myrepo/gcs-bigquery-loader:latest'
    - '.'

# Push Image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'push'
    - 'us-central1-docker.pkg.dev/project-77158318-bf9d-4d5d-bcc/myrepo/gcs-bigquery-loader:latest'

# Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    - 'run'
    - 'deploy'
    - 'gcs-bigquery-loader'
    - '--image=us-central1-docker.pkg.dev/project-77158318-bf9d-4d5d-bcc/myrepo/gcs-bigquery-loader:latest'
    - '--region=us-central1'
    - '--platform=managed'
    - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY